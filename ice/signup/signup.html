<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        #formContainer {
            position: relative;
            width: 640px;
            max-width: 100%;
            background: #fff;
            border: 12px solid #0c3a8a;
            border-radius: 32px;
            overflow: hidden;
        }
        #formContainer h3 {
            text-align: center;
            font-size: 24px;
            padding-top: 24px;
        }
        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 18px 16px;
            padding: 24px 30px;
        }
        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            height: 32px;
            padding: 2px 6px;
            font: inherit;
        }
        #myForm > section {
            grid-column: 1 / -1;
            text-align: center;
        }
        #myForm section button {
            font: inherit;
            padding: 4px 14px;
        }
        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 4px;
            background: #fff;
        }

        .books a {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 150px;
            padding-top: 22px;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            color: #c9a86a;
            font-size: 14px;
            line-height: 1.1;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
        }

        /* Dark tint over each cover so the gold text stays readable */
        .books a::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
        }

        .books a {
            position: relative;
        }

        .books span {
            position: relative;
            border-top: 1px solid #c9a86a;
            border-bottom: 1px solid #c9a86a;
            padding: 4px 6px;
        }

        .books .old-testament { background-image: url("images/old_testament.webp"); }
        .books .new-testament { background-image: url("images/new_testament.webp"); }
        .books .book-of-mormon { background-image: url("images/book_of_mormon.webp"); }
        .books .doctrine-covenants { background-image: url("images/doctrine_and_covenants.webp"); }
        .books .pearl { background-image: url("images/pearl_of_great_price.webp"); }

        @media (max-width: 520px) {
            .books a {
                font-size: 11px;
            }
        }
        #closeBtn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1;
            width: 42px;
            height: 34px;
            background: #f0f0f0;
            border: 1px solid #888;
            border-radius: 3px;
            font-size: 18px;
            cursor: pointer;
        }

        .hero {
            height: 260px;
            background: url("images/jesus_feeds_5000.jpeg") center 30% / cover no-repeat;
            display: grid;
            place-items: center;
            color: #fff;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
        }
        
        .hero h1 {
            margin-top: 40px;
            font-size: 56px;
            line-height: 1;
        }
        .hero span {
            display: block;
            font-size: 40px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>

        <header class="hero">
            <h1>Daily Feed<span>Scripture a Day</span></h1>
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <nav class="books">
            <a href="#" class="old-testament"><span>Old<br>Testament</span></a>
            <a href="#" class="new-testament"><span>New<br>Testament</span></a>
            <a href="#" class="book-of-mormon"><span>Book<br>of<br>Mormon</span></a>
            <a href="#" class="doctrine-covenants"><span>Doctrine<br>and<br>Covenants</span></a>
            <a href="#" class="pearl"><span>Pearl of<br>Great Price</span></a>
        </nav>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
